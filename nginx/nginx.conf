# nginx/nginx.conf

server {
    listen 80;
    server_name localhost;

    # Set the maximum allowed size of the client request body (e.g., 10M for images)
    client_max_body_size 10M;

    location / {
        # Standard proxy settings for regular HTTP requests
        proxy_pass http://web-app:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # --- NEW: Specific configuration for Socket.IO ---
    # This block is essential for WebSocket connections to work through the proxy.
    location /socket.io {
        proxy_pass http://web-app:5001/socket.io;
        
        # These headers are required to upgrade the connection to a WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}