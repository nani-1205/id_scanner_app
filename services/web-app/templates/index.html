<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Intelligent Document Processor</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        :root {
            --primary-color: #4f46e5; --primary-hover: #4338ca; --secondary-color: #6b7280; --light-grey: #f9fafb;
            --border-color: #e5e7eb; --text-color: #111827; --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: var(--light-grey); color: var(--text-color); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background-color: #1f2937; color: #d1d5db; border-right: 1px solid #374151; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { margin-top: 0; font-size: 1.1rem; color: white; padding-bottom: 10px; font-weight: 600; }
        #search-history { width: 100%; background: #374151; border: 1px solid #4b5563; color: white; padding: 8px; border-radius: 4px; margin-bottom: 15px; }
        .history-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        .history-item { padding: 10px; margin-bottom: 5px; border-radius: 5px; cursor: pointer; transition: background-color 0.2s; font-size: 0.9rem; }
        .history-item:hover { background-color: #374151; }
        .history-item.active { background-color: var(--primary-color); color: white; }
        .history-item span { display: block; font-size: 0.75rem; opacity: 0.6; }
        .main-content { flex-grow: 1; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; padding: 30px; overflow-y: auto; }
        .card { background-color: #fff; padding: 1.5rem; border-radius: 0.5rem; box-shadow: var(--card-shadow); }
        .form-group { margin-bottom: 1.5rem; }
        label { font-weight: 500; display: block; margin-bottom: 0.5rem; font-size: 0.9rem; }
        input, textarea, select { width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.375rem; font-size: 1rem; }
        button { background: var(--primary-color); color: white; padding: 0.7rem 1.5rem; border: none; border-radius: 0.375rem; cursor: pointer; font-size: 1rem; font-weight: 500; width: 100%; transition: background-color 0.2s; }
        button:hover:not(:disabled) { background: var(--primary-hover); }
        button:disabled { background: var(--secondary-color); cursor: not-allowed; }
        .status-bar { margin-top: 1.5rem; padding: 1rem; border-radius: 0.375rem; text-align: center; }
        .results-area, .document-viewer { height: calc(100vh - 60px); display: flex; flex-direction: column; }
        .document-viewer .card, .results-area .card { height: 100%; display: flex; flex-direction: column; }
        .image-container { position: relative; border: 1px solid var(--border-color); border-radius: 0.5rem; overflow: hidden; flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #f3f4f6;}
        #document-image { max-width: 100%; max-height: 100%; object-fit: contain; }
        #highlight-box { position: absolute; border: 2px solid #ef4444; background: rgba(239, 68, 68, 0.2); transition: all 0.1s ease-in-out; pointer-events: none; }
        .data-container { overflow-y: auto; }
        .data-field { margin-bottom: 1rem; }
        .data-field label { font-size: 0.8rem; color: var(--secondary-color); margin-bottom: 0.25rem; }
        .data-field input { font-family: monospace; font-size: 0.9rem; }
        .skeleton { animation: shimmer 1.5s infinite linear; background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; border-radius: 4px; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>History</h2>
        <input type="text" id="search-history" placeholder="Search history...">
        <ul id="history-list" class="history-list"></ul>
    </div>
    <main class="main-content">
        <div class="document-viewer">
            <div class="card">
                <form id="upload-form" style="margin-bottom: 1.5rem;">
                    <div class="form-group">
                        <label for="document_image">Upload Document</label>
                        <input type="file" id="document_image" name="document_image" accept="image/*,application/pdf" required>
                    </div>
                    <div class="form-group">
                        <label for="document_type">Document Type</label>
                        <input type="text" id="document_type" name="document_type" placeholder="e.g., Invoice, Passport, Receipt" required>
                    </div>
                    <button type="submit" id="submit-button">Extract Data</button>
                </form>
                <div id="status-bar" class="status-bar" style="display: none;"></div>
                <div class="image-container" id="image-container">
                    <img id="document-image" src="" alt="Document Preview">
                    <div id="highlight-box"></div>
                </div>
            </div>
        </div>
        <div class="results-area">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3>Extracted Data</h3>
                    <button id="save-changes-btn" style="width: auto; display: none;">Save Changes</button>
                </div>
                <div class="data-container" id="data-container">
                    <!-- Data fields will be populated here -->
                </div>
                <div id="photo-container" style="display:none; margin-top: 1rem;">
                    <h4>Photograph</h4>
                    <img id="extracted-photo" style="width: 150px; border-radius: 8px;">
                </div>
                <div id="signature-container" style="display:none; margin-top: 1rem;">
                    <h4>Signature</h4>
                    <img id="extracted-signature" style="width: 200px; filter: invert(1);">
                </div>
            </div>
        </div>
    </main>

<script>
const socket = io();
const state = { currentDocId: null, originalData: {} };

// --- DOM Element Cache ---
const DOMElements = {
    form: document.getElementById('upload-form'),
    submitButton: document.getElementById('submit-button'),
    statusBar: document.getElementById('status-bar'),
    imageContainer: document.getElementById('image-container'),
    documentImage: document.getElementById('document-image'),
    highlightBox: document.getElementById('highlight-box'),
    dataContainer: document.getElementById('data-container'),
    photoContainer: document.getElementById('photo-container'),
    extractedPhoto: document.getElementById('extracted-photo'),
    signatureContainer: document.getElementById('signature-container'),
    extractedSignature: document.getElementById('extracted-signature'),
    historyList: document.getElementById('history-list'),
    searchHistoryInput: document.getElementById('search-history'),
    saveChangesBtn: document.getElementById('save-changes-btn')
};

// --- UI Update Functions ---
const showStatus = (message, type, isLoading = false) => {
    DOMElements.statusBar.textContent = message;
    DOMElements.statusBar.className = `status-bar status-${type}`;
    DOMElements.statusBar.style.display = 'block';
    DOMElements.submitButton.disabled = isLoading;
};

const renderDataFields = (data) => {
    DOMElements.dataContainer.innerHTML = '';
    state.originalData = data;
    for (const key in data) {
        const fieldData = data[key];
        const value = fieldData && typeof fieldData === 'object' ? fieldData.value : fieldData;
        const bbox = fieldData && typeof fieldData === 'object' ? fieldData.bbox : null;

        const fieldDiv = document.createElement('div');
        fieldDiv.className = 'data-field';
        
        const label = document.createElement('label');
        label.textContent = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        
        const input = document.createElement('input');
        input.type = 'text';
        input.value = JSON.stringify(value, null, 2).replace(/"/g, '');
        input.dataset.key = key;
        
        if (bbox) {
            input.addEventListener('mouseover', () => highlightBbox(bbox));
            input.addEventListener('mouseout', () => DOMElements.highlightBox.style.display = 'none');
        }
        
        fieldDiv.appendChild(label);
        fieldDiv.appendChild(input);
        DOMElements.dataContainer.appendChild(fieldDiv);
    }
    DOMElements.saveChangesBtn.style.display = 'block';
};

const highlightBbox = (bbox) => {
    const [xmin, ymin, xmax, ymax] = bbox;
    const imgRect = DOMElements.documentImage.getBoundingClientRect();
    const containerRect = DOMElements.imageContainer.getBoundingClientRect();

    const scaleX = imgRect.width / DOMElements.documentImage.naturalWidth;
    const scaleY = imgRect.height / DOMElements.documentImage.naturalHeight;

    const topOffset = (containerRect.height - imgRect.height) / 2;
    const leftOffset = (containerRect.width - imgRect.width) / 2;

    DOMElements.highlightBox.style.display = 'block';
    DOMElements.highlightBox.style.left = `${leftOffset + (xmin * DOMElements.documentImage.naturalWidth * scaleX)}px`;
    DOMElements.highlightBox.style.top = `${topOffset + (ymin * DOMElements.documentImage.naturalHeight * scaleY)}px`;
    DOMElements.highlightBox.style.width = `${(xmax - xmin) * DOMElements.documentImage.naturalWidth * scaleX}px`;
    DOMElements.highlightBox.style.height = `${(ymax - ymin) * DOMElements.documentImage.naturalHeight * scaleY}px`;
};

const displayDocument = (doc) => {
    renderDataFields(doc.extracted_data);
    
    DOMElements.photoContainer.style.display = doc.extracted_photograph_base64 ? 'block' : 'none';
    if(doc.extracted_photograph_base64) DOMElements.extractedPhoto.src = `data:image/jpeg;base64,${doc.extracted_photograph_base64}`;
    
    DOMElements.signatureContainer.style.display = doc.extracted_signature_base64 ? 'block' : 'none';
    if(doc.extracted_signature_base64) DOMElements.extractedSignature.src = `data:image/png;base64,${doc.extracted_signature_base64}`;

    state.currentDocId = doc._id;
};

// --- History & Data Fetching ---
const fetchHistory = async (query = '') => {
    try {
        const response = await fetch(`/history?q=${encodeURIComponent(query)}`);
        const history = await response.json();
        DOMElements.historyList.innerHTML = '';
        history.forEach(item => {
            const li = document.createElement('li');
            li.className = 'history-item';
            li.dataset.id = item.id;
            li.innerHTML = `${item.type} <span>${item.filename}</span>`;
            li.addEventListener('click', () => fetchAndDisplayDocument(item.id, li));
            DOMElements.historyList.appendChild(li);
        });
    } catch (error) { console.error("Failed to fetch history:", error); }
};

const fetchAndDisplayDocument = async (docId, listItem) => {
    showStatus('Loading...', 'processing', true);
    try {
        const response = await fetch(`/document/${docId}`);
        const doc = await response.json();
        if (response.ok) {
            DOMElements.documentImage.src = `data:image/jpeg;base64,${doc.image_base64 || ''}`;
            displayDocument(doc);
            showStatus('Loaded from history.', 'success');
            document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
            if(listItem) listItem.classList.add('active');
        } else {
            showStatus(`Error: ${doc.error}`, 'error');
        }
    } catch (error) {
        showStatus(`Network Error: ${error}`, 'error');
    } finally {
        DOMElements.submitButton.disabled = false;
    }
};

// --- Event Listeners ---
DOMElements.form.addEventListener('submit', async (e) => {
    e.preventDefault();
    showStatus('Uploading and queuing job...', 'processing', true);
    
    const formData = new FormData(DOMElements.form);
    const file = DOMElements.form.querySelector('input[type=file]').files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (event) => DOMElements.documentImage.src = event.target.result;
        reader.readAsDataURL(file);
    }
    
    try {
        const response = await fetch('/scan', { method: 'POST', body: formData });
        const data = await response.json();
        if (response.ok) {
            showStatus(`Processing... Job ID: ${data.job_id.substring(0,8)}...`, 'processing', true);
            socket.once(`extraction_complete_${data.job_id}`, async (result) => {
                if (result.status === 'completed') {
                    await fetchHistory(); // Refresh history
                    const newListItem = document.querySelector(`.history-item[data-id='${result.doc_id}']`);
                    fetchAndDisplayDocument(result.doc_id, newListItem); // Fetch and display the new result
                } else {
                    showStatus(`Error: ${result.message}`, 'error', false);
                }
            });
        } else {
            showStatus(`Error: ${data.error}`, 'error', false);
        }
    } catch (error) {
        showStatus(`Network Error: ${error}`, 'error', false);
    }
});

DOMElements.saveChangesBtn.addEventListener('click', async () => {
    if (!state.currentDocId) return;
    const updatedData = { ...state.originalData };
    DOMElements.dataContainer.querySelectorAll('input').forEach(input => {
        const key = input.dataset.key;
        if (updatedData[key] && typeof updatedData[key] === 'object') {
            // This is a naive update, a real app would handle types better
            updatedData[key].value = input.value;
        } else {
            updatedData[key] = input.value;
        }
    });
    
    try {
        const response = await fetch(`/document/${state.currentDocId}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ extracted_data: updatedData })
        });
        const result = await response.json();
        showStatus(result.message || result.error, response.ok ? 'success' : 'error');
    } catch (error) {
        showStatus(`Network Error: ${error}`, 'error');
    }
});

let searchTimeout;
DOMElements.searchHistoryInput.addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        fetchHistory(e.target.value);
    }, 300);
});

// Initial load
document.addEventListener('DOMContentLoaded', fetchHistory);

</script>
</body>
</html>
