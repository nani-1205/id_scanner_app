{% extends 'base.html' %}
{% block title %}Upload Document{% endblock %}
{% block content %}
<div class="card">
    <h2>Scan a New Document</h2>
    <p>Select the document type and upload the corresponding images. Front and back images will be combined into a PDF for processing.</p>
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="doc_type">Document Type:</label>
            <select name="doc_type" id="doc_type" required>
                <option value="" disabled selected>-- Choose a type --</option>
                <option value="Passport">Passport</option>
                <option value="Driving License">Driving License</option>
                <option value="Aadhaar Card">Aadhaar Card</option>
                <option value="Emirates ID">Emirates ID</option>
                <option value="Visa">Visa</option>
                <option value="Other">Other Document</option>
            </select>
        </div>

        <!-- Explicit Front and Back Image Inputs -->
        <div class="form-group">
            <label for="front_image">Front Image:</label>
            <input type="file" name="front_image" id="front_image" required accept="image/*">
        </div>
        <div class="form-group">
            <label for="back_image">Back Image (Optional):</label>
            <input type="file" name="back_image" id="back_image" accept="image/*">
        </div>
        
        <div class="form-group">
            <button type="submit" class="btn">Extract Data</button>
        </div>
    </form>
</div>
{% endblock %}
