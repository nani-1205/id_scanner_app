# Note: The 'version' attribute is obsolete and has been removed.

services:
  nginx:
    # Builds from the ./nginx directory
    build: ./nginx
    container_name: ocr_nginx
    ports:
      - "80:80"
    depends_on:
      - app-1
      - app-2
    networks:
      - ocr_network

  # YAML anchor for the Flask application's base configuration
  app-1: &app_base
    # Builds from the ./ocr_app directory
    build: ./ocr_app
    restart: always
    expose:
      - "5000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./ocr_app:/app
    networks:
      - ocr_network

  app-2:
    # Inherits all properties from app_base, including the correct build context
    <<: *app_base

  # YAML anchor for the Celery worker's base configuration
  celery_worker-1: &celery_base
    # Builds from the ./ocr_app directory
    build: ./ocr_app
    restart: always
    command: ["celery", "-A", "app.celery", "worker", "--loglevel=info"]
    env_file:
      - .env
    depends_on:
      - app-1
      - app-2
      - redis
    volumes:
      - ./ocr_app:/app
    networks:
      - ocr_network

  celery_worker-2:
    # Inherits all properties from celery_base, including the correct build context
    <<: *celery_base

  redis:
    image: "redis:alpine"
    container_name: ocr_redis
    networks:
      - ocr_network

  db:
    image: postgres:15-alpine
    container_name: ocr_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ocr_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTG-RES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    # <<< THE CRITICAL FIX IS HERE >>>
    # This service MUST build from the ./ollama directory.
    build: ./ollama
    container_name: ocr_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ocr_network

volumes:
  postgres_data:
  ollama_data:

networks:
  ocr_network:
    driver: bridge