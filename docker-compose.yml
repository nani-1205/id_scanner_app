services:
  nginx:
    build: ./nginx
    container_name: ocr_nginx
    ports:
      - "80:80"
    depends_on:
      - app-1
      - app-2
    networks:
      - ocr_network

  app-1: &app_base
    build: ./ocr_app
    restart: always
    # <<< THE FIX IS HERE (Part 1) >>>
    # Use the host's network directly. This bypasses Docker's internal networking.
    network_mode: "host"
    env_file:
      - .env
    # We no longer need depends_on for network services, as we are on the host network.
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./ocr_app:/app
    # Note: 'networks' is not used with network_mode: host

  app-2:
    <<: *app_base

  celery_worker-1: &celery_base
    build: ./ocr_app
    restart: always
    command: ["celery", "-A", "app.celery", "worker", "--loglevel=info"]
    env_file:
      - .env
    # <<< THE FIX IS HERE (Part 2) >>>
    network_mode: "host"
    depends_on:
      - app-1
      - app-2
    volumes:
      - ./ocr_app:/app

  celery_worker-2:
    <<: *celery_base

  # --- Services on the Bridge Network ---
  # These services can still communicate with each other on the bridge network.
  # Our Python apps can reach them via 'localhost' because they share the host network.

  redis:
    image: "redis:alpine"
    container_name: ocr_redis
    networks:
      - ocr_network
    ports: # Expose the port to the host so our Python apps can find it
      - "6379:6379"

  db:
    image: postgres:15-alpine
    container_name: ocr_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ocr_network
    ports: # Expose the port to the host
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    build: ./ollama
    container_name: ocr_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ocr_network

volumes:
  postgres_data:
  ollama_data:

# The bridge network is still needed for the backend services to communicate.
networks:
  ocr_network:
    driver: bridge