services:
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web-app
    networks:
      - app-net

  web-app:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: web_app
    restart: always
    env_file: .env
    command: python /app/web-app/app.py
    volumes:
      - ./services/web-app:/app/web-app
    depends_on:
      - rabbitmq
      - mongo
    networks:
      - app-net
    dns: # This is the critical fix for the web-app startup crash
      - 1.1.1.1   # Cloudflare DNS
      - 8.8.8.8   # Google DNS

  worker:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: ocr_worker
    restart: always
    env_file: .env
    command: python -u /app/worker/worker.py # The "-u" flag ensures logs appear immediately
    volumes:
      - ./services/worker:/app/worker
    depends_on:
      ollama-text:
        condition: service_started
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy # This prevents the worker from starting too early
    networks:
      - app-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck: # This block ensures RabbitMQ is fully ready before the worker starts
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net
      
  mongo:
    image: mongo
    container_name: mongodb
    restart: always
    env_file: .env
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d # This runs the user creation script
    networks:
      - app-net

  ollama-text:
    image: ollama/ollama
    container_name: ollama_text_service
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-net

volumes:
  mongo_data:
  ollama_data:

networks:
  app-net:
    driver: bridge